<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Love Live! All-Series Song Tierlist</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>🎀 Love Live! <span>Song Tierlist</span></h1>
    <p class="sub">µ's · Aqours · Nijigasaki · Liella! · Hasunosora — 902 lagu, satu tierlist</p>
  </header>

  <!-- Series nav -->
  <nav id="seriesnav" class="series"></nav>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <input type="search" id="search-input" placeholder="🔍 Cari lagu atau album..." />
    </div>
    <div class="view-switch">
      <button id="btn-view-albums">📁 Per Album</button>
      <button id="btn-view-songs" class="active">🎵 Per Lagu (Direct Drag)</button>
    </div>
    <label class="toggle-label">
      <input type="checkbox" id="hide-tiered-toggle" checked />
      <span>Sembunyikan ter-tier</span>
    </label>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button id="btn-export-png" class="btn-primary">📷 Export PNG</button>
      <button id="btn-export-json" class="ghost" title="Simpan data ke file JSON">💾 Backup</button>
      <button id="btn-import-json" class="ghost" title="Muat data dari file JSON">📂 Import</button>
      <input type="file" id="json-file-input" accept=".json" style="display:none" />
      <button id="btn-reset" class="ghost">Reset</button>
      <label class="switch"><input type="checkbox" id="dark-toggle" checked /><span>Dark</span></label>
    </div>
  </div>

  <!-- Tierlist -->
  <section id="tierlist" class="tiers">
    <div class="tier-head">
      <div class="tier-head-title">
        <span>Tierlist Global</span>
        <span class="tier-tip">💡 Tarik (drag) foto lagu dari galeri bawah langsung ke baris tier</span>
      </div>
      <div class="tier-head-actions">
        <button id="btn-clear-tiers" class="ghost-sm">Kosongkan Semua Tier</button>
      </div>
    </div>
    <div id="tiers"></div>
  </section>

  <!-- Album / Song grid -->
  <div class="grid-header">
    <h2 id="grid-title">Pilih & Drag Lagu Ke Tierlist</h2>
  </div>
  <section id="grid" class="grid"></section>
</div>

<!-- Album modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="modal-close" class="close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Song Detail Modal -->
<div id="song-detail-modal" class="modal hidden">
  <div class="modal-box song-detail-box">
    <button id="song-detail-close" class="close">&times;</button>
    <div id="song-detail-body"></div>
  </div>
</div>

<!-- Image Export Preview Modal -->
<div id="export-modal" class="modal hidden">
  <div class="modal-box export-box">
    <button id="export-close" class="close">&times;</button>
    <h3>📷 Hasil Export Tierlist PNG</h3>
    <div id="export-preview-container" class="export-preview"></div>
    <div class="export-actions">
      <a id="download-png-link" class="btn-primary-lg" download="love-live-tierlist.png">⬇️ Unduh Gambar (PNG)</a>
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
