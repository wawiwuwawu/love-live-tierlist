name: Verify data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate local data
        run: python scripts/verify_data.py

      - name: Check pinned LLerNote snapshot
        run: python scripts/sync_llernote.py --check
